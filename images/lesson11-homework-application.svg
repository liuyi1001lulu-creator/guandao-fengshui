<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 435" width="680" height="435" role="img" aria-label="七星理论应期学习流程"><title>七星理论应期学习流程</title><rect width="680" height="435" rx="14" fill="#fffdf7"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="42" y="12" width="596" height="84" rx="9" fill="#e8efe6" stroke="#d9cdb4" stroke-width="1.5"/><text x="340" y="44" font-size="27" font-weight="600" fill="#28483f" text-anchor="middle">识别磁场</text><text x="340" y="73" font-size="22" font-weight="400" fill="#28483f" text-anchor="middle">大场、小场、人场</text><path d="M340 96 V114 l-5 -6 m5 6 l5 -6" fill="none" stroke="#a78a53" stroke-width="2"/><rect x="42" y="118" width="596" height="84" rx="9" fill="#fbf8ef" stroke="#d9cdb4" stroke-width="1.5"/><text x="340" y="150" font-size="27" font-weight="600" fill="#28483f" text-anchor="middle">确认五行</text><text x="340" y="179" font-size="22" font-weight="400" fill="#28483f" text-anchor="middle">按课堂属性寻找应期</text><path d="M340 202 V220 l-5 -6 m5 6 l5 -6" fill="none" stroke="#a78a53" stroke-width="2"/><rect x="42" y="224" width="596" height="84" rx="9" fill="#e8efe6" stroke="#d9cdb4" stroke-width="1.5"/><text x="340" y="256" font-size="27" font-weight="600" fill="#28483f" text-anchor="middle">判断应期</text><text x="340" y="285" font-size="22" font-weight="400" fill="#28483f" text-anchor="middle">相位：本位与对冲；理法：三合、六合</text><path d="M340 308 V326 l-5 -6 m5 6 l5 -6" fill="none" stroke="#a78a53" stroke-width="2"/><rect x="42" y="330" width="596" height="84" rx="9" fill="#fbf8ef" stroke="#d9cdb4" stroke-width="1.5"/><text x="340" y="362" font-size="27" font-weight="600" fill="#28483f" text-anchor="middle">选择应对</text><text x="340" y="391" font-size="22" font-weight="400" fill="#28483f" text-anchor="middle">三合月份重点注意；其他月份扬长避短</text></g></svg>