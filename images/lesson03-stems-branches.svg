<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 292" width="680" height="292" role="img" aria-label="天干与地支的本质"><title>天干与地支的本质</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#a78a53"/></marker></defs><rect width="680" height="292" rx="15" fill="#fffdf7"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="16" y="12" width="318" height="122" rx="12" fill="#e8efe6" stroke="#d9cdb4" stroke-width="1.5"/><text x="175" y="44" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">天干 · 阳</text><text x="175" y="74" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">方向、性质、总体规律</text><text x="175" y="102" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">中央决策、三原色</text><rect x="346" y="12" width="318" height="122" rx="12" fill="#fbf8ef" stroke="#d9cdb4" stroke-width="1.5"/><text x="505" y="44" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">地支 · 阴</text><text x="505" y="74" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">承载、落实、具体变化</text><text x="505" y="102" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">执行部门、调色盘</text><rect x="16" y="146" width="318" height="122" rx="12" fill="#e8efe6" stroke="#d9cdb4" stroke-width="1.5"/><text x="175" y="178" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">在天成象</text><text x="175" y="208" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">天干偏外在呈现</text><rect x="346" y="146" width="318" height="122" rx="12" fill="#fbf8ef" stroke="#d9cdb4" stroke-width="1.5"/><text x="505" y="178" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">在地成形</text><text x="505" y="208" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">地支供给并支撑天干</text></g></svg>