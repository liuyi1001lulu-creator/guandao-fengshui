<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 426" width="680" height="426" role="img" aria-label="大场、小场、人场的不同处理原则"><title>大场、小场、人场的不同处理原则</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#a78a53"/></marker></defs><rect width="680" height="426" rx="15" fill="#fffdf7"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="16" y="12" width="648" height="122" rx="12" fill="#e8efe6" stroke="#d9cdb4" stroke-width="1.5"/><text x="340" y="46" font-size="26" font-weight="600" fill="#28483f" text-anchor="middle">大场</text><text x="340" y="78" font-size="23" font-weight="400" fill="#736b59" text-anchor="middle">门、主、灶</text><text x="340" y="107" font-size="23" font-weight="400" fill="#736b59" text-anchor="middle">人气高低为核心 · 化解</text><rect x="16" y="146" width="648" height="122" rx="12" fill="#fbf8ef" stroke="#d9cdb4" stroke-width="1.5"/><text x="340" y="180" font-size="26" font-weight="600" fill="#28483f" text-anchor="middle">小场</text><text x="340" y="212" font-size="23" font-weight="400" fill="#736b59" text-anchor="middle">调和</text><text x="340" y="241" font-size="23" font-weight="400" fill="#736b59" text-anchor="middle">具体操作待补</text><rect x="16" y="280" width="648" height="122" rx="12" fill="#e8efe6" stroke="#d9cdb4" stroke-width="1.5"/><text x="340" y="314" font-size="26" font-weight="600" fill="#28483f" text-anchor="middle">人场</text><text x="340" y="346" font-size="23" font-weight="400" fill="#736b59" text-anchor="middle">人与流年 · 人事、心态、人际关系</text><text x="340" y="375" font-size="23" font-weight="400" fill="#736b59" text-anchor="middle">不可化解，只可调和</text></g></svg>