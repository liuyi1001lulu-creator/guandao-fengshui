<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 292" width="680" height="292" role="img" aria-label="土的作用与转化"><title>土的作用与转化</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#a78a53"/></marker></defs><rect width="680" height="292" rx="15" fill="#fffdf7"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="16" y="12" width="318" height="122" rx="12" fill="#e8efe6" stroke="#d9cdb4" stroke-width="1.5"/><text x="175" y="44" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">土 · 转化</text><text x="175" y="74" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">承接、协调五行变化</text><text x="175" y="102" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">四季最后一个月属土</text><rect x="346" y="12" width="318" height="122" rx="12" fill="#fbf8ef" stroke="#d9cdb4" stroke-width="1.5"/><text x="505" y="44" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">阳土 · 艮</text><text x="505" y="74" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">调节冬水生木过寒</text><rect x="16" y="146" width="318" height="122" rx="12" fill="#e8efe6" stroke="#d9cdb4" stroke-width="1.5"/><text x="175" y="178" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">阴土 · 坤</text><text x="175" y="208" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">缓和火克金的力量</text><rect x="346" y="146" width="318" height="122" rx="12" fill="#fbf8ef" stroke="#d9cdb4" stroke-width="1.5"/><text x="505" y="178" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">外生内克</text><text x="505" y="208" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">物成其物</text><text x="505" y="236" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">滋养与约束并行</text></g></svg>