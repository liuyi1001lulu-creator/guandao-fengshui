<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 292" width="680" height="292" role="img" aria-label="太极的三个特性"><title>太极的三个特性</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#a78a53"/></marker></defs><rect width="680" height="292" rx="15" fill="#fffdf7"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="16" y="12" width="318" height="122" rx="12" fill="#e8efe6" stroke="#d9cdb4" stroke-width="1.5"/><text x="175" y="44" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">阴阳对应</text><text x="175" y="74" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">对立而统一</text><text x="175" y="102" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">同频共振</text><rect x="346" y="12" width="318" height="122" rx="12" fill="#fbf8ef" stroke="#d9cdb4" stroke-width="1.5"/><text x="505" y="44" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">此消彼长</text><text x="505" y="74" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">昼夜消长</text><text x="505" y="102" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">春夏秋冬变化</text><rect x="16" y="146" width="318" height="122" rx="12" fill="#e8efe6" stroke="#d9cdb4" stroke-width="1.5"/><text x="175" y="178" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">阴阳互根</text><text x="175" y="208" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">你中有我</text><text x="175" y="236" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">我中有你</text><rect x="346" y="146" width="318" height="122" rx="12" fill="#fbf8ef" stroke="#d9cdb4" stroke-width="1.5"/><text x="505" y="178" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">根本含义</text><text x="505" y="208" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">相互依存、不断变化</text><text x="505" y="236" font-siz