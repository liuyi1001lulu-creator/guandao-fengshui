<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 305" width="600" height="305" role="img" aria-label="三边论与立主"><title>三边论与立主</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#a78a53"/></marker></defs><rect width="600" height="305" rx="15" fill="#fffdf7"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="55" y="12" width="490" height="76" rx="12" fill="#e8efe6" stroke="#d9cdb4" stroke-width="1.5"/><text x="300" y="41" font-size="27" font-weight="600" fill="#28483f" text-anchor="middle">找几何中心</text><text x="300" y="69" font-size="22" font-weight="400" fill="#736b59" text-anchor="middle">确定天心位、判断缺角</text><path d="M300 88 V107" stroke="#a78a53" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><rect x="55" y="112" width="490" height="76" rx="12" fill="#fbf8ef" stroke="#d9cdb4" stroke-width="1.5"/><text x="300" y="141" font-size="27" font-weight="600" fill="#28483f" text-anchor="middle">测方位</text><text x="300" y="169" font-size="22" font-weight="400" fill="#736b59" text-anchor="middle">参考地砖线、罗盘测量</text><path d="M300 188 V207" stroke="#a78a53" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><rect x="55" y="212" width="490" height="76" rx="12" fill="#e8efe6" stroke="#d9cdb4" stroke-width="1.5"/><text x="300" y="241" font-size="27" font-weight="600" fill="#28483f" text-anchor="middle">矫正大四方</text><text x="300" y="269" font-size="22" font-weight="400" fill="#736b59" text-anchor="middle">为定磁场、定门提供依据</text></g></svg>