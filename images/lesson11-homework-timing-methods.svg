<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 325" width="680" height="325" role="img" aria-label="相位与理法应期判断"><title>相位与理法应期判断</title><rect width="680" height="325" rx="14" fill="#fffdf7"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="230" y="10" width="220" height="57" rx="9" fill="#e8efe6" stroke="#d9cdb4" stroke-width="1.5"/><text x="340" y="46" font-size="29" font-weight="600" fill="#28483f" text-anchor="middle">应期判断</text><path d="M340 67 V86 H170 V102 M340 86 H510 V102" fill="none" stroke="#a78a53" stroke-width="2"/><rect x="15" y="102" width="310" height="166" rx="9" fill="#fbf8ef" stroke="#d9cdb4" stroke-width="1.5"/><text x="170" y="136" font-size="26" font-weight="600" fill="#28483f" text-anchor="middle">相位关系</text><text x="170" y="176" font-size="23" font-weight="400" fill="#28483f" text-anchor="middle">本位与对冲</text><text x="170" y="211" font-size="21" font-weight="400" fill="#28483f" text-anchor="middle">子午、卯酉相对</text><text x="170" y="246" font-size="19" font-weight="400" fill="#736b59" text-anchor="middle">课堂所述90%</text><rect x="355" y="102" width="310" height="166" rx="9" fill="#fbf8ef" stroke="#d9cdb4" stroke-width="1.5"/><text x="510" y="136" font-size="26" font-weight="600" fill="#28483f" text-anchor="middle">理法关系</text><text x="510" y="176" font-size="23" font-weight="400" fill="#28483f" text-anchor="middle">三合、六合应期</text><text x="510" y="211" font-size="21" font-weight="400" fill="#28483f" text-anchor="middle">稳定性、指向性</text><text x="510" y="246" font-size="19" font-weight="400" fill="#736b59" text-anchor="middle">三合：课堂所述60%—80%</text><text x="340" y="305" font-size="20" font-weight="400" fill="#736b59" text-anchor="middle">六合未单独标明准确率；百分比未经独立验证</text></g></svg>