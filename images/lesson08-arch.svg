<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 378" width="680" height="378" role="img" aria-label="拱合论：角力与中力"><title>拱合论：角力与中力</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#a78a53"/></marker></defs><rect width="680" height="378" rx="15" fill="#fffdf7"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="22" y="15" width="636" height="278" rx="12" fill="#fffdf7" stroke="#d9cdb4" stroke-width="1.5"/><rect x="78" y="38" width="524" height="224" fill="#fbf8ef" stroke="#28483f" stroke-width="4"/><path d="M253 38 V262 M427 38 V262 M78 150 H602" stroke="#d9cdb4" stroke-width="2" stroke-dasharray="5 5"/><rect x="78" y="38" width="90" height="90" fill="#e8efe6"/><rect x="512" y="38" width="90" height="90" fill="#e8efe6"/><rect x="253" y="108" width="174" height="84" fill="#e8efe6"/><text x="123" y="88" font-size="29" font-weight="600" fill="#28483f" text-anchor="middle">角</text><text x="557" y="88" font-size="29" font-weight="600" fill="#28483f" text-anchor="middle">角</text><text x="340" y="66" font-size="26" font-weight="500" fill="#28483f" text-anchor="middle">边</text><text x="340" y="158" font-size="30" font-weight="600" fill="#28483f" text-anchor="middle">中</text><text x="161" y="158" font-size="27" font-weight="500" fill="#28483f" text-anchor="middle">侧</text><text x="515" y="158" font-size="27" font-weight="500" fill="#28483f" text-anchor="middle">侧</text><text x="340" y="323" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">角力大于边力　·　中力大于侧力</text><text x="340" y="356" font-size="20" font-weight="400" fill="#736b59" text-anchor="middle">仅为课堂判断原则示意，不代表实际磁场测量</text></g></svg>