<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" width="680" height="372" role="img" aria-label="水的五种五行取象"><title>水的五种五行取象</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#a78a53"/></marker></defs><rect width="680" height="372" rx="15" fill="#fffdf7"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="16" y="12" width="318" height="104" rx="12" fill="#e8efe6" stroke="#d9cdb4" stroke-width="1.5"/><text x="175" y="44" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">水性</text><text x="175" y="74" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">向下流动、滋润</text><rect x="346" y="12" width="318" height="104" rx="12" fill="#fbf8ef" stroke="#d9cdb4" stroke-width="1.5"/><text x="505" y="44" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">火性</text><text x="505" y="74" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">沸腾、升腾</text><rect x="16" y="128" width="318" height="104" rx="12" fill="#e8efe6" stroke="#d9cdb4" stroke-width="1.5"/><text x="175" y="160" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">金性</text><text x="175" y="190" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">冻结、坚硬</text><rect x="346" y="128" width="318" height="104" rx="12" fill="#fbf8ef" stroke="#d9cdb4" stroke-width="1.5"/><text x="505" y="160" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">土性</text><text x="505" y="190" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">承载营养、滋养</text><rect x="16" y="244" width="318" height="104" rx="12" fill="#e8efe6" stroke="#d9cdb4" stroke-width="1.5"/><text x="175" y="276" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">木性</text><text x="175" y="306" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">颜料绘画、形态伸展</text></g></svg>