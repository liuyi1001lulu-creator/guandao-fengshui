<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 292" width="680" height="292" role="img" aria-label="阴阳：表现与支撑"><title>阴阳：表现与支撑</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#a78a53"/></marker></defs><rect width="680" height="292" rx="15" fill="#fffdf7"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="16" y="12" width="318" height="122" rx="12" fill="#e8efe6" stroke="#d9cdb4" stroke-width="1.5"/><text x="175" y="44" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">阳 · 表现</text><text x="175" y="74" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">看得见、发散、向上</text><text x="175" y="102" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">书写动作</text><rect x="346" y="12" width="318" height="122" rx="12" fill="#fbf8ef" stroke="#d9cdb4" stroke-width="1.5"/><text x="505" y="44" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">阴 · 支撑</text><text x="505" y="74" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">看不见、内敛、聚合</text><text x="505" y="102" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">墨水承载</text><rect x="16" y="146" width="318" height="122" rx="12" fill="#e8efe6" stroke="#d9cdb4" stroke-width="1.5"/><text x="175" y="178" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">相互依存</text><text x="175" y="208" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">无动作则无文字</text><text x="175" y="236" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">无墨水则无字迹</text><rect x="346" y="146" width="318" height="122" rx="12" fill="#fbf8ef" stroke="#d9cdb4" stroke-width="1.5"/><text x="505" y="178" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">阴阳相配</text><text x="505" y="208" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">孤阴不生，独阳不长</text><text x="505" y="236" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">阴中有阳，阳中有阴</text></g></svg>