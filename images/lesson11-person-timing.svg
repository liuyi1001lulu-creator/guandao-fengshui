<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-label="人场应期与扬长避短"><title>人场应期与扬长避短</title><rect width="600" height="420" rx="15" fill="#fffdf7"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="55" y="12" width="490" height="78" rx="10" fill="#e8efe6" stroke="#d9cdb4"/><text x="300" y="43" font-size="27" font-weight="600" fill="#28483f" text-anchor="middle">人场</text><text x="300" y="71" font-size="22" fill="#736b59" text-anchor="middle">人与流年形成的磁场</text><path d="M300 90 V110 l-5 -6 m5 6 l5 -6" stroke="#a78a53" stroke-width="2" fill="none"/><rect x="55" y="114" width="490" height="78" rx="10" fill="#fbf8ef" stroke="#d9cdb4"/><text x="300" y="145" font-size="27" font-weight="600" fill="#28483f" text-anchor="middle">课堂案例：生气</text><text x="300" y="173" font-size="22" fill="#736b59" text-anchor="middle">属木 · 亥、卯、未月</text><path d="M300 192 V212 l-5 -6 m5 6 l5 -6" stroke="#a78a53" stroke-width="2" fill="none"/><rect x="55" y="216" width="490" height="78" rx="10" fill="#e8efe6" stroke="#d9cdb4"/><text x="300" y="247" font-size="27" font-weight="600" fill="#28483f" text-anchor="middle">注意三合月份</text><text x="300" y="275" font-size="22" fill="#736b59" text-anchor="middle">课堂以事业起色为例</text><path d="M300 294 V314 l-5 -6 m5 6 l5 -6" stroke="#a78a53" stroke-width="2" fill="none"/><rect x="55" y="318" width="490" height="78" rx="10" fill="#fbf8ef" stroke="#d9cdb4"/><text x="300" y="349" font-size="27" font-weight="600" fill="#28483f" text-anchor="middle">其他月份</text><text x="300" y="377" font-size="22" fill="#736b59" text-anchor="middle">扬长避短 · 人事与心态</text></g></svg>