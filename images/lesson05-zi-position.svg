<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 292" width="680" height="292" role="img" aria-label="子位与虚日鼠"><title>子位与虚日鼠</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#a78a53"/></marker></defs><rect width="680" height="292" rx="15" fill="#fffdf7"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="16" y="12" width="318" height="122" rx="12" fill="#e8efe6" stroke="#d9cdb4" stroke-width="1.5"/><text x="175" y="44" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">子位</text><text x="175" y="74" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">正北、阳水、冬季</text><text x="175" y="102" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">潜藏、孕育、封藏</text><rect x="346" y="12" width="318" height="122" rx="12" fill="#fbf8ef" stroke="#d9cdb4" stroke-width="1.5"/><text x="505" y="44" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">虚日鼠</text><text x="505" y="74" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">虚宿传统名称</text><text x="505" y="102" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">北方玄武七宿之一</text><rect x="16" y="146" width="318" height="122" rx="12" fill="#e8efe6" stroke="#d9cdb4" stroke-width="1.5"/><text x="175" y="178" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">子位宿区</text><text x="175" y="208" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">女、虚、危等星宿</text><text x="175" y="236" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">虚日鼠并非唯一</text><rect x="346" y="146" width="318" height="122" rx="12" fill="#fbf8ef" stroke="#d9cdb4" stroke-width="1.5"/><text x="505" y="178" font-size="25" font-weight="600" fill="#28483f" text-anchor="middle">关联</text><text x="505" y="208" font-size="21" font-weight="400" fill="#736b59" text-anchor="middle">天上星宿、地上方位</text><text x="505" y="23